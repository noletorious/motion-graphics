<script id="piece-kit">
// piece-kit v1. Source of truth: elements/piece-kit.js.
// `npm run sync-kit` copies this into every piece's <script id="piece-kit">,
// so each piece stays a single self-contained file.
//
// A piece defines (before the kit boots on load):
//   Piece.setup()            optional, runs once after fonts load (measure layout here); may be async
//   Piece.render(t)          draw everything for time t; must be pure
//   Piece.sounds             [{ t, fn(ctx, out, at) }] one-shot sound events
//   Piece.cuts               optional scene-cut times, shown as trim handles on the review page
//   Piece.gain               optional master trim, to keep the export peak near -7 dBFS
// The kit provides: stage scaling, playback, Web Audio scheduling, URL params,
// postMessage control from the site, and window.piece for export.
;(() => {
  const P = new URLSearchParams(location.search)
  const meta = (n) => document.querySelector(`meta[name="piece:${n}"]`)?.content
  const DUR = Number(meta('duration'))
  const LOOP = meta('loop') === 'true'
  const [W, H] = { '1:1': [1080, 1080], '9:16': [1080, 1920] }[meta('aspect')] ?? [1920, 1080]
  const EXPORT = P.has('export')
  const EMBED = window.parent !== window

  // ---------- math ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
  const lerp = (a, b, p) => a + (b - a) * p
  const ease = {
    lin: (p) => p,
    in3: (p) => p * p * p,
    out3: (p) => 1 - Math.pow(1 - p, 3),
    inOut3: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
    inOutExpo: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
    outBack: (p) => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2),
    outBackSoft: (p) => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2),
    outElastic: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
    outBounce: (p) => {
      const n = 7.5625, d = 2.75
      if (p < 1 / d) return n * p * p
      if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75
      if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375
      return n * (p -= 2.625 / d) * p + 0.984375
    },
  }
  /** eased progress of t between a and b, 0..1 */
  const tw = (t, a, b, e = ease.out3) => e(clamp((t - a) / (b - a)))
  /** set transform/opacity/filter in one call */
  const css = (el, o) => {
    if (!el) return
    const tr = []
    if (o.x != null || o.y != null) tr.push(`translate(${o.x ?? 0}px,${o.y ?? 0}px)`)
    if (o.r != null) tr.push(`rotate(${o.r}deg)`)
    if (o.ry != null) tr.push(`perspective(1600px) rotateY(${o.ry}deg)`)
    if (o.s != null) tr.push(`scale(${o.s})`)
    if (o.sx != null || o.sy != null) tr.push(`scale(${o.sx ?? 1},${o.sy ?? 1})`)
    el.style.transform = tr.join(' ')
    if (o.o != null) el.style.opacity = o.o
    if (o.blur != null) el.style.filter = o.blur > 0.05 ? `blur(${o.blur}px)` : 'none'
    if (o.clip != null) el.style.clipPath = o.clip
    if (o.v != null) el.style.visibility = o.v ? 'visible' : 'hidden'
  }
  /** seeded PRNG, so "random" layouts are identical every render */
  const rng = (seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646
  const $ = (s) => document.querySelector(s)
  const $$ = (s) => [...document.querySelectorAll(s)]

  // ---------- sound ----------
  const noiseBufs = new WeakMap()
  const noiseBuf = (ctx) => {
    if (!noiseBufs.has(ctx)) {
      const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate)
      const d = b.getChannelData(0), r = rng(7)
      for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1
      noiseBufs.set(ctx, b)
    }
    return noiseBufs.get(ctx)
  }
  const env = (ctx, at, { attack = 0.005, dur = 0.3, gain = 0.3, curve = 'exp' } = {}) => {
    const g = ctx.createGain()
    g.gain.setValueAtTime(0.0001, at)
    g.gain.linearRampToValueAtTime(gain, at + attack)
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, at + dur)
    else g.gain.linearRampToValueAtTime(0.0001, at + dur)
    return g
  }
  const S = {
    tone(ctx, out, at, { f = 440, to, type = 'sine', dur = 0.3, gain = 0.2, attack = 0.005, detune = 0 } = {}) {
      const o = ctx.createOscillator()
      o.type = type
      o.frequency.setValueAtTime(f, at)
      if (to) o.frequency.exponentialRampToValueAtTime(to, at + dur)
      o.detune.value = detune
      const g = env(ctx, at, { attack, dur, gain })
      o.connect(g).connect(out)
      o.start(at)
      o.stop(at + dur + 0.05)
    },
    noise(ctx, out, at, { dur = 0.2, gain = 0.2, f = 2000, to, q = 0.8, type = 'bandpass', attack = 0.005, curve = 'exp' } = {}) {
      const s = ctx.createBufferSource()
      s.buffer = noiseBuf(ctx)
      const fl = ctx.createBiquadFilter()
      fl.type = type
      fl.Q.value = q
      fl.frequency.setValueAtTime(f, at)
      if (to) fl.frequency.exponentialRampToValueAtTime(to, at + dur)
      const g = env(ctx, at, { attack, dur, gain, curve })
      s.connect(fl).connect(g).connect(out)
      s.start(at, 0)
      s.stop(at + dur + 0.05)
    },
    kick(ctx, out, at, gain = 0.5) {
      S.tone(ctx, out, at, { f: 150, to: 45, dur: 0.28, gain, type: 'sine' })
      S.noise(ctx, out, at, { f: 3000, dur: 0.02, gain: gain * 0.25, type: 'highpass' })
    },
    hat(ctx, out, at, gain = 0.06) {
      S.noise(ctx, out, at, { f: 8000, dur: 0.05, gain, type: 'highpass', q: 0.5 })
    },
    click(ctx, out, at, gain = 0.15, f = 2400) {
      S.noise(ctx, out, at, { f, dur: 0.025, gain, q: 2 })
    },
    pluck(ctx, out, at, f, gain = 0.18, dur = 0.5) {
      S.tone(ctx, out, at, { f, dur, gain, type: 'triangle' })
      S.tone(ctx, out, at, { f: f * 2, dur: dur * 0.5, gain: gain * 0.25, type: 'sine' })
    },
    keys(ctx, out, at, f, gain = 0.12, dur = 1.6) {
      // soft electric-piano-ish tone
      S.tone(ctx, out, at, { f, dur, gain, type: 'sine', attack: 0.004 })
      S.tone(ctx, out, at, { f: f * 2, dur: dur * 0.4, gain: gain * 0.3, type: 'sine' })
      S.tone(ctx, out, at, { f: f * 3.01, dur: dur * 0.15, gain: gain * 0.12, type: 'sine' })
    },
    pad(ctx, out, at, freqs, dur = 2, gain = 0.05) {
      for (const f of freqs) {
        S.tone(ctx, out, at, { f, dur, gain, type: 'triangle', attack: 0.25, detune: -6 })
        S.tone(ctx, out, at, { f, dur, gain: gain * 0.7, type: 'sine', attack: 0.25, detune: 7 })
      }
    },
    whoosh(ctx, out, at, dur = 0.4, gain = 0.18, up = true) {
      S.noise(ctx, out, at, { f: up ? 400 : 4000, to: up ? 4000 : 400, dur, gain, q: 1.2, attack: dur * 0.6, curve: 'lin' })
    },
    thump(ctx, out, at, gain = 0.5) {
      S.tone(ctx, out, at, { f: 90, to: 38, dur: 0.45, gain })
      S.noise(ctx, out, at, { f: 600, dur: 0.12, gain: gain * 0.35, type: 'lowpass' })
    },
    chime(ctx, out, at, f = 880, gain = 0.12) {
      ;[1, 2.01, 3.02, 4.2].forEach((m, i) => S.tone(ctx, out, at, { f: f * m, dur: 1.4 - i * 0.25, gain: gain / (i + 1) }))
    },
  }
  const note = (n) => 440 * Math.pow(2, (n - 69) / 12) // MIDI → Hz

  // ---------- playback ----------
  const Piece = (window.Piece = { setup: null, render: () => {}, sounds: [], cuts: [], gain: 1 })
  window.K = { clamp, lerp, ease, tw, css, rng, $, $$, S, note, W, H, DUR }

  let t = clamp(Number(P.get('t') ?? 0), 0, DUR)
  let playing = false, raf = 0, lastNow = 0, lastPost = -1, rate = 1
  let muted = P.has('muted') ? P.get('muted') !== '0' : EMBED
  let ctx = null, bus = null, schedAbs = 0, absT = 0

  const draw = () => {
    Piece.render(t)
    if (EMBED && Math.abs(t - lastPost) > 0.03) post('time')
  }
  const post = (type) => {
    lastPost = t
    if (EMBED) window.parent.postMessage({ source: 'piece', type, t, duration: DUR, playing, muted, rate, cuts: Piece.cuts }, '*')
  }

  function audioOn() {
    if (muted || EXPORT) return false
    ctx ??= new (window.AudioContext || window.webkitAudioContext)()
    if (ctx.state === 'suspended') ctx.resume()
    return true
  }
  function newBus() {
    if (bus) {
      const old = bus
      old.gain.setTargetAtTime(0, ctx.currentTime, 0.02)
      setTimeout(() => old.disconnect(), 200)
    }
    bus = null
    if (!audioOn()) return
    bus = master(ctx)
    absT = t
    schedAbs = t
  }
  function master(c) {
    const comp = c.createDynamicsCompressor()
    comp.threshold.value = -10
    comp.ratio.value = 4
    const g = c.createGain()
    g.gain.value = 0.9 * Piece.gain
    g.connect(comp).connect(c.destination)
    return g
  }
  // Lookahead scheduler on a monotonic clock, so loops wrap cleanly.
  function schedule() {
    if (!bus || !ctx) return
    const horizon = absT + 0.25 * rate
    const sounds = Piece.sounds
    while (schedAbs < horizon) {
      const cycle = Math.floor(schedAbs / DUR)
      const from = schedAbs - cycle * DUR
      const to = Math.min(DUR, from + (horizon - schedAbs))
      for (const e of sounds) {
        if (e.t >= from && e.t < to) {
          const at = ctx.currentTime + (cycle * DUR + e.t - absT) / rate
          if (at >= ctx.currentTime - 0.01) e.fn(ctx, bus, Math.max(at, ctx.currentTime))
        }
      }
      schedAbs = cycle * DUR + to
      if (to >= DUR && !LOOP) break
    }
  }

  function frame(now) {
    if (!playing) return
    const dt = Math.min(0.1, (now - lastNow) / 1000) * rate
    lastNow = now
    t += dt
    absT += dt
    if (t >= DUR) {
      if (LOOP) t -= DUR
      else {
        t = DUR
        draw()
        pause()
        post('ended')
        return
      }
    }
    draw()
    schedule()
    raf = requestAnimationFrame(frame)
  }
  function play() {
    if (playing) return
    if (!LOOP && t >= DUR - 0.01) t = 0
    playing = true
    lastNow = performance.now()
    newBus()
    schedule()
    raf = requestAnimationFrame(frame)
    post('play')
  }
  function pause() {
    playing = false
    cancelAnimationFrame(raf)
    if (bus && ctx) newBus()
    post('pause')
  }
  function seek(x) {
    t = clamp(x, 0, DUR)
    draw()
    if (playing) newBus()
  }
  function setRate(r) {
    rate = r
    if (playing) newBus()
    post('rate')
  }
  function setMuted(m) {
    muted = m
    if (playing) newBus()
    post('mute')
  }

  // Export: schedule every sound for one pass onto any BaseAudioContext.
  function buildAudio(c, when = 0) {
    const out = master(c)
    for (const e of Piece.sounds) e.fn(c, out, when + e.t)
  }

  window.piece = { duration: DUR, loop: LOOP, width: W, height: H, seek, play, pause, buildAudio, setMuted, setRate, get cuts() { return Piece.cuts }, get t() { return t }, ready: false }

  // ---------- stage ----------
  function fit() {
    const stage = document.getElementById('stage')
    if (EXPORT) {
      stage.style.transform = 'none'
      return
    }
    const s = Math.min(innerWidth / W, innerHeight / H)
    stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`
  }
  const base = document.createElement('style')
  base.textContent = `*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000}#stage{position:absolute;left:0;top:0;width:${W}px;height:${H}px;overflow:hidden;transform-origin:0 0}`
  document.head.prepend(base)
  addEventListener('resize', fit)

  addEventListener('message', (e) => {
    const m = e.data
    if (!m || m.source !== 'site') return
    if (m.type === 'play') play()
    if (m.type === 'pause') pause()
    if (m.type === 'seek') seek(m.t)
    if (m.type === 'restart') { seek(0); play() }
    if (m.type === 'mute') setMuted(!!m.muted)
    if (m.type === 'rate') setRate(Number(m.rate) || 1)
  })
  if (!EMBED && !EXPORT) {
    // Opened directly: click toggles sound + restarts, space toggles play.
    addEventListener('click', () => { setMuted(false); seek(0); play() })
    addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play() } })
  }

  addEventListener('load', async () => {
    fit()
    await document.fonts.ready
    await Piece.setup?.()
    draw()
    window.piece.ready = true
    post('ready')
    if (!EXPORT && !P.has('t') && (P.get('autoplay') === '1' || !EMBED)) play()
  })
})()
</script>

    <div class="L photo" id="p85" style="background-image:url(../../../assets/photos/cybercab-85.jpg);background-position:50% 8%;filter:brightness(.62)"></div>
    <div class="mark" id="tm" style="left:920px;top:110px;width:80px;height:80px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="12.4 0 253.9 252.6"><g fill="currentColor"><path transform="translate(-33.796,-64.797)" d="m173.146 317.299 35.476-199.519c33.815 0 44.481 3.708 46.021 18.843 0 0 22.684-8.458 34.125-25.636-44.646-20.688-89.505-21.621-89.505-21.621l-26.176 31.882 0.059-4e-3 -26.176-31.883s-44.86 0.934-89.5 21.622c11.431 17.178 34.124 25.636 34.124 25.636 1.549-15.136 12.202-18.844 45.79-18.868l35.762 199.548"/>
    <path transform="translate(-33.796,-64.797)" d="m173.132 80.157c36.09-0.276 77.399 5.583 119.687 24.014 5.652-10.173 7.105-14.669 7.105-14.669-46.227-18.289-89.518-24.548-126.797-24.705-37.277 0.157-80.566 6.417-126.787 24.705 0 0 2.062 5.538 7.1 14.669 42.28-18.431 83.596-24.29 119.687-24.014h5e-3"/></g></svg></div>
    <div class="mark" id="wm" style="left:770px;top:220px;width:380px;height:50px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 324.0 278.7 36.5"><g fill="currentColor"><path transform="translate(-28.524,-64.797)" d="m28.524 388.986c0.812 3.167 3.554 6.404 7.316 7.215h11.37l0.58 0.229v28.691h7.1v-28.691l0.645-0.229h11.38c3.804-0.98 6.487-4.048 7.285-7.215v-0.07h-45.676v0.07"/><path transform="translate(-28.524,-64.797)" d="m98.795 425.202h27.011c3.758-0.747 6.551-4.058 7.334-7.263h-41.679c0.778 3.206 3.612 6.516 7.334 7.263"/><path transform="translate(-28.524,-64.797)" d="m98.795 410.485h27.011c3.758-0.741 6.551-4.053 7.334-7.262h-41.679c0.778 3.21 3.612 6.521 7.334 7.262"/><path transform="translate(-28.524,-64.797)" d="m98.795 396.163h27.011c3.758-0.749 6.551-4.058 7.334-7.265h-41.679c0.778 3.207 3.612 6.516 7.334 7.265"/><path transform="translate(-28.524,-64.797)" d="m160.398 396.094h24.954c3.762-1.093 6.921-3.959 7.691-7.136h-39.64v21.415h32.444v7.515l-25.449 0.02c-3.988 1.112-7.37 3.79-9.057 7.327l2.062-0.038h39.415v-21.944h-32.42v-7.159"/><path transform="translate(-28.524,-64.797)" d="m245.319 425.206c3.543-1.502 5.449-4.1 6.179-7.14h-31.517l0.02-29.118-7.065 0.02v36.238h32.383"/><path transform="translate(-28.524,-64.797)" d="m272.845 396.192h27.02c3.753-0.746 6.544-4.058 7.331-7.262h-41.681c0.779 3.205 3.611 6.516 7.33 7.262"/><path transform="translate(-28.524,-64.797)" d="m266.601 403.28v21.912h7.027v-14.589h25.575v14.589h7.022v-21.874l-39.624-0.038"/></g></svg></div>
    <div class="spray" id="sp" style="left:810px;top:300px;width:300px;height:110px"></div>
  </div>
  <!-- transitions -->
  <div class="L" id="dip" style="z-index:9"></div>
  <div class="a" id="wline" style="z-index:9"></div>
  <div class="grain" style="z-index:10"></div>
</div>
<script type="module">
import { THREE, createWorld, loadCar, loadLettering, buildPad, buildDrive, lightWipe, drawMap, ROUTE } from '../../../assets/lib/tesla.js'
import { V, CH, groove, pads, loadSample } from '../../../assets/lib/sound.js'
const { tw, css, ease, lerp, clamp, $ } = K
let st, car, text, pad, drive, tron

// shot starts, on the 120 BPM grid (one beat = 0.5s)
const S1 = 0, S2 = 2, S3 = 4, S4 = 5.5, S5 = 7, S6 = 9.5, S7 = 11, S8 = 12.5
const WIPE4 = [S4 - 0.2, S4 + 0.15], WIPE6 = [S6 - 0.2, S6 + 0.15] // light-bar wipes
const ZOOM5 = [S5 - 0.15, S5 + 0.2] // zoom-through into the drive
const DIP7 = [S7 - 0.2, S7 + 0.2] // dip to black into the charge
const FADE8 = [S8 - 0.2, S8 + 0.25] // crossfade to the end card

Piece.setup = async () => {
  st = createWorld($('#gl'), 1920, 1080)
  car = await loadCar()
  text = await loadLettering(3.6, 5.0, { rainbow: st.renderer })
  pad = buildPad(st)
  drive = buildDrive(st)
  st.scene.add(car, text)
  drawMap($('#map'), { route: false })
  tron = await loadSample('../../../assets/sounds/tron.wav')
}

const vis = (el, on) => (el.style.visibility = on ? 'visible' : 'hidden')
// type comes in sharp: a short rise behind a clip, then holds
const rise = (el, t, at, on = true) => {
  const p = tw(t, at, at + 0.45, ease.out3)
  vis($(el), on && t >= at)
  css($(el), { y: lerp(40, 0, p), o: clamp(p * 2), clip: p < 1 ? `inset(-30% -10% ${(1 - p) * 60 - 30}% -10%)` : 'none' })
}

// ---- the phone's map: world metres → screen pixels (citymap: 2048px for 80m, centred on 0,0)
const K_MAP = 0.24, CENTRE = [-4, 10], SCREEN = [198, 300]
const toScreen = ([x, z]) => [SCREEN[0] + (x - CENTRE[0]) * 25.6 * K_MAP, SCREEN[1] + (z - CENTRE[1]) * 25.6 * K_MAP]
const lens = ROUTE.slice(1).map((p, i) => Math.hypot(p[0] - ROUTE[i][0], p[1] - ROUTE[i][1])), full = lens.reduce((a, b) => a + b)
function along(u) {
  let d = u * full
  for (let i = 0; i < lens.length; i++) {
    if (d <= lens[i] || i === lens.length - 1) {
      const [a, b] = [ROUTE[i], ROUTE[i + 1]], f = Math.min(1, d / lens[i])
      return { p: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], ang: Math.atan2(a[1] - b[1], a[0] - b[0]) } // heading toward the rider (route start)
    }
    d -= lens[i]
  }
}
const TAP = 2.8

function render3D(t) {
  const shot = t < S2 + 0.1 ? 1 : t < S6 ? 5 : 7
  text.visible = shot === 1
  car.visible = shot !== 1
  drive.group.visible = shot === 5
  pad.group.visible = shot === 7
  st.floor.visible = shot !== 1
  st.scene.fog = shot === 5 ? new THREE.Fog(0x07080b, 18, 60) : null
  if (shot === 1) {
    // the chrome lettering turns in out of the dark, catching the rainbow as it goes, then rushes the camera
    text.position.set(0, 1.25, 0)
    text.rotation.y = THREE.MathUtils.degToRad(lerp(-120, 0, tw(t, 0, 1.5, ease.outBackSoft)))
    text.rotation.x = THREE.MathUtils.degToRad(lerp(14, 0, tw(t, 0, 1.5, ease.out3)))
    const z = lerp(lerp(8.5, 6.2, tw(t, 0, 1.5, ease.out3)), 2.2, tw(t, 1.6, 2.1, ease.in3))
    st.camera.position.set(0.01, 2.25, z)
    st.camera.lookAt(0, 2.05, 0)
  } else if (shot === 5) {
    // driving: the car holds, the world streams past; a slow tracking move
    const tt = t - (S5 - 0.15)
    drive.set(tt)
    car.position.set(0, 0, 0)
    car.rotation.y = 0
    car.userData.setBar(1)
    const k = tw(t, S5 - 0.15, S6, ease.lin)
    st.camera.position.set(lerp(7.8, 5.6, k), lerp(1.5, 1.2, k), lerp(5.4, 6.4, k))
    st.camera.lookAt(0.6, 0.75, 0)
    st.key.intensity = 120
    st.key.position.set(2.5, 8, 4)
    st.key.target.position.set(0, 0, 0)
  } else {
    // parked on the pad at night, a slow orbit; green pulses ripple out from under the car
    car.position.set(0, 0, 0)
    car.rotation.y = 0
    car.userData.setBar(0.4)
    pad.set(t - S7)
    const a = Math.PI / 4 + 0.18 * tw(t, S7, S8, ease.lin), r = Math.hypot(5.4, 5.4)
    st.camera.position.set(r * Math.sin(a), 5.2, r * Math.cos(a))
    st.camera.lookAt(0, 0.2, 0)
    st.key.intensity = 156
    st.key.position.set(2.5, 8, 4)
    st.key.target.position.set(0, 0, 0)
  }
  st.renderer.render(st.scene, st.camera)
}

Piece.render = (t) => {
  // ---- 3D layer: on for 1, 5 and 7; it sits above whatever it covers
  const in1 = t < S2 + 0.1, in5 = t >= ZOOM5[0] && t < WIPE6[1], in7 = t >= S7 && t < FADE8[1]
  const w3 = $('#w3')
  vis(w3, in1 || in5 || in7)
  w3.style.zIndex = in1 ? 10 : in5 ? 5 : 7
  $('#bg3').style.background = in1
    ? 'radial-gradient(ellipse 60% 55% at 50% 45%,#16120e,#060504 70%,#000)'
    : in5 ? '#07080b' : 'radial-gradient(ellipse 50% 40% at 50% 62%,#0f1a13,#050706 70%)'
  if (in1 || in5 || in7) render3D(t)
  // 1 → 2: the lettering rushes the lens and the layer falls away to the blurred street
  const out1 = tw(t, 1.75, S2 + 0.1, ease.in3)
  // 4 → 5: zoom-through: the photo blows forward and blurs out, the drive settles in from a blur
  const z5 = tw(t, ZOOM5[0], ZOOM5[1], ease.inOut3)
  css(w3, in1 ? { o: 1 - out1 } : in5 && t < ZOOM5[1] ? { s: lerp(1.25, 1, z5), o: z5, blur: lerp(14, 0, z5) } : { o: 1, blur: 0 })

  // ---- 2 · the hail screen over the blurred street
  vis($('#sh2'), t >= S2 - 0.1 && t < S3 + 0.2)
  const up = tw(t, S2 - 0.1, S2 + 0.45, ease.out3), away = tw(t, S3 - 0.3, S3 + 0.15, ease.in3)
  css($('#phone'), { y: lerp(900, 0, up) + lerp(0, 1150, away), s: lerp(1, 0.94, away) })
  css($('#map'), { x: SCREEN[0] - (CENTRE[0] + 40) * 25.6 * K_MAP, y: SCREEN[1] - (CENTRE[1] + 40) * 25.6 * K_MAP, s: K_MAP })
  const [px, py] = toScreen(ROUTE[0])
  $('#pin').style.left = `${px}px`
  $('#pin').style.top = `${py}px`
  const cab = along(lerp(0.62, 0.42, tw(t, TAP + 0.1, S3, ease.inOut3)))
  const [cx, cy] = toScreen(cab.p)
  // the route left to drive: from the cab back along the streets to the rider's pin
  let seg = 0
  for (let d = 0, u = lerp(0.62, 0.42, tw(t, TAP + 0.1, S3, ease.inOut3)) * full; seg < lens.length && d + lens[seg] < u; seg++) d += lens[seg]
  $('#rline').setAttribute('points', [cab.p, ...ROUTE.slice(0, seg + 1).reverse()].map((q) => toScreen(q).join(',')).join(' '))
  $('#cab').style.left = `${cx}px`
  $('#cab').style.top = `${cy}px`
  $('#cab').style.transform = `rotate(${cab.ang}rad)`
  const press = tw(t, TAP - 0.12, TAP, ease.out3) * (1 - tw(t, TAP + 0.05, TAP + 0.35))
  css($('#touch'), { o: press, s: lerp(0.6, 1, press) })
  css($('#btn'), { s: 1 - 0.04 * press })
  const booked = t >= TAP + 0.05
  $('#btn').style.background = booked ? 'var(--accent)' : '#fff'
  $('#btn').textContent = booked ? 'On the way · 3 min' : 'Request'
  $('#eta').textContent = booked ? 'Arriving in 3 min · Mercer St' : 'Pickup in 3 min · Mercer St'

  // ---- 3 · the street comes into focus as the phone drops away
  vis($('#sh3'), t >= S2 - 0.1 && t < WIPE4[1])
  const focus = tw(t, S3 - 0.25, S3 + 0.2, ease.inOut3)
  css($('#p82'), { s: lerp(1.14, 1.08, focus) + 0.04 * tw(t, S3, S4, ease.lin) })
  $('#p82').style.filter = focus < 1 ? `blur(${lerp(18, 0, focus)}px) brightness(${lerp(0.45, 1, focus)})` : 'none'
  css($('#sh3-shade'), { o: focus })
  rise('#c3', t, S3 + 0.2)

  // ---- 4 · every seat (light-bar wipe in)
  vis($('#sh4'), t >= WIPE4[0] && t < ZOOM5[1])
  const w4 = tw(t, WIPE4[0], WIPE4[1], ease.inOut3)
  if (t < ZOOM5[0]) lightWipe($('#sh4'), $('#wline'), w4)
  css($('#p75'), { s: lerp(1.12, 1.18, tw(t, S4, S5, ease.lin)) })
  // out: blown forward into the drive
  const o4 = tw(t, ZOOM5[0], ZOOM5[1], ease.in3)
  if (t >= ZOOM5[0]) css($('#sh4'), { s: lerp(1, 1.4, o4), o: 1 - o4, blur: 14 * o4 })
  else css($('#sh4'), { o: 1, blur: 0 })
  rise('#c4a', t, S4 + 0.2)
  rise('#c4b', t, S4 + 0.35)
  rise('#c5', t, S5 + 0.35, in5)

  // ---- 6 · drops you off (light-bar wipe in over the drive)
  vis($('#sh6'), t >= WIPE6[0] && t < S7)
  const w6 = tw(t, WIPE6[0], WIPE6[1], ease.inOut3)
  if (t >= WIPE6[0] - 0.01) lightWipe($('#sh6'), $('#wline'), w6)
  css($('#p83'), { s: lerp(1.1, 1.16, tw(t, S6, S7, ease.lin)) })
  rise('#c6a', t, S6 + 0.2)
  rise('#c6b', t, S6 + 0.35)

  // ---- 7 · charge (dip through black)
  css($('#dip'), { o: t < S7 ? tw(t, DIP7[0], S7, ease.in3) : 1 - tw(t, S7, DIP7[1], ease.out3) })
  rise('#c7', t, S7 + 0.25, in7)
  rise('#c7b', t, S7 + 0.45, in7)

  // ---- 8 · end card (crossfade), T, wordmark, then the lettering sprays on
  vis($('#sh8'), t >= FADE8[0])
  css($('#sh8'), { o: tw(t, FADE8[0], FADE8[1], ease.inOut3) })
  css($('#p85'), { s: lerp(1.06, 1, tw(t, S8, 15, ease.out3)) })
  rise('#tm', t, S8 + 0.3)
  rise('#wm', t, S8 + 0.45)
  const sp = tw(t, S8 + 0.8, S8 + 1.6, ease.inOut3)
  css($('#sp'), { v: t >= S8 + 0.8, clip: `inset(0 ${(1 - sp) * 100}% 0 0)` })
}

// ---- sound: hits timed from the visuals' own numbers; low, dark music at 120 BPM (1 bar = 2s) ----
const chordAt = (t) => [CH.Am, CH.Am, CH.F, CH.F, CH.C, CH.G, CH.Am, CH.F][Math.floor(t / 2)]
const mid = ([a, b]) => (a + b) / 2 // inOut3 transitions cross half-way at their midpoint
const every = (from, to, step, fn) => Array.from({ length: Math.ceil((to - from) / step) }, (_, i) => ({ t: from + i * step, fn }))
Piece.sounds = [
  // music
  { t: 0, fn: (c, o, a) => V.sample(c, o, a, tron, { gain: 0.9, dur: 2.6, fade: 0.5 }) }, // the intro, under the chrome lettering
  ...pads(0, S2, chordAt, 0.012),
  ...groove(S2, S3, chordAt, { kick: false, clap: false, arp: true, level: 0.6 }), // the phone: no drums yet
  ...groove(S3, ZOOM5[0], chordAt, { level: 0.85 }),
  ...pads(S2, S5, chordAt),
  ...groove(S5, WIPE6[1], chordAt, { arp: true }),
  ...pads(S5, S7, chordAt),
  ...groove(S7, FADE8[0], chordAt, { clap: false, level: 0.7 }),
  ...pads(S7, S8, chordAt, 0.014),
  { t: S8, fn: (c, o, a) => (V.stab(c, o, a, CH.Am.slice(1)), V.bass(c, o, a, 55, 2.2, 0.1)) },
  ...pads(S8, 15, () => CH.Am, 0.02),
  { t: S8 + 0.8, fn: (c, o, a) => V.pluck(c, o, a, 64, 0.035, 0.9) },
  { t: S8 + 1.6, fn: (c, o, a) => V.pluck(c, o, a, 69, 0.03, 1.3) },
  // design
  { t: S2 + 0.15, fn: (c, o, a) => V.swoosh(c, o, a, 0.5, 0.025) }, // the phone rises in
  { t: TAP - 0.02, fn: (c, o, a) => V.tap(c, o, a) }, // finger on "Request"
  { t: TAP + 0.05, fn: (c, o, a) => V.glint(c, o, a, 69, 0.03) }, // booked
  { t: S3 - 0.1, fn: (c, o, a) => V.swoosh(c, o, a, 0.5, 0.035) }, // the phone drops away
  { t: S3 + 0.1, fn: (c, o, a) => V.impact(c, o, a, 0.15) }, // the street snaps into focus
  { t: mid(WIPE4), fn: (c, o, a) => V.swoosh(c, o, a, 0.45, 0.04) },
  { t: mid(ZOOM5), fn: (c, o, a) => V.swoosh(c, o, a, 0.4, 0.05) },
  { t: S5, fn: (c, o, a) => V.impact(c, o, a, 0.22) },
  { t: ZOOM5[0], fn: (c, o, a) => V.motor(c, o, a, WIPE6[1] - ZOOM5[0], () => 0.55, 0.018) }, // cruising
  ...every(ZOOM5[0], WIPE6[0], 0.6, (c, o, a) => V.ping(c, o, a, 0.025)), // a ping as each lidar ring leaves the car
  { t: mid(WIPE6), fn: (c, o, a) => V.swoosh(c, o, a, 0.45, 0.04) },
  { t: S7, fn: (c, o, a) => V.impact(c, o, a, 0.2) }, // out of the black
  { t: S7, fn: (c, o, a) => V.hum(c, o, a, FADE8[1] - S7, (tt) => 0.3 + 0.7 * Math.exp(-((tt % pad.PERIOD) / pad.PERIOD) * 5), 0.05, 49) },
  ...every(S7, FADE8[0], 0.75, (c, o, a) => V.ping(c, o, a, 0.022, 147)), // each green wave (pad.PERIOD)
  { t: S8, fn: (c, o, a) => V.impact(c, o, a, 0.25) },
  { t: S8 + 0.3, fn: (c, o, a) => V.glint(c, o, a, 76, 0.022) }, // the T
  { t: S8 + 0.8, fn: (c, o, a) => V.spray(c, o, a, 0.8, 0.04) }, // the lettering sprays on
]
Piece.cuts = [S2, S3, S4, S5, S6, S7, S8]

Piece.gain = 0.78
</script>
